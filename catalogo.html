<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Aroma & Co.</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
 <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="header">
    <a href="index.html" class="logo">AROMA & CO.</a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="catalogo.html" class="active">Catálogo</a></li>
      <li><a href="nosotros.html">Nosotros</a></li>
      <li><a href="locales.html">Sucursales</a></li>
    </ul>
    <button class="cart-icon-btn" id="openCartBtn">
      🛒 <span class="cart-count" id="cartCountBadge">0</span>
    </button>
  </header>

  <section class="section-container" style="padding-top:130px;">
    <div class="section-header reveal">
      <p>Nuestra Menú Completo</p>
      <h2>Catálogo de Especialidad</h2>
    </div>

    <!-- Buscador y Filtros -->
    <div style="max-width: 500px; margin: 0 auto 30px;" class="reveal">
      <input type="text" id="searchInput" placeholder="Buscar por nombre o descripción..." class="modal-select">
    </div>

<!-- Botones de Filtro Mejorados -->
<div class="filter-buttons reveal">
  <button class="filter-btn active" data-filter="all">
    <span class="btn-icon">✨</span> Todos
  </button>
  <button class="filter-btn" data-filter="bar">
    <span class="btn-icon">☕</span> Bebidas de Bar
  </button>
  <button class="filter-btn" data-filter="granos">
    <span class="btn-icon">🫘</span> Granos en Bolsa
  </button>
  <button class="filter-btn" data-filter="postres">
    <span class="btn-icon">🥐</span> Repostería
  </button>
  <button class="filter-btn" data-filter="brunch">
    <span class="btn-icon">🥑</span> Brunch
  </button>
</div>
    <!-- Grilla donde se renderizan los productos -->
    <div class="product-grid" id="catalogGrid"></div>
  </section>

  <footer>
    <p>&copy; 2026 Aroma & Co. - Todos los derechos reservados.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
